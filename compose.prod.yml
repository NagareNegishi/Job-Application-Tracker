services:

  nginx:
    # Pull pre-built image from ECR — built and pushed by GitHub Actions CI.
    # ECR_REGISTRY format: {account-id}.dkr.ecr.ap-southeast-2.amazonaws.com
    # Set ECR_REGISTRY in the .env file on EC2 (see .env.example).
    image: ${ECR_REGISTRY}/jobtracker-frontend:latest
    ports:
      - "80:80"
      - "443:443"  # needed for SSL (Let's Encrypt / Certbot) — wired up in a later step
    volumes:
      # Certbot writes certs to /etc/letsencrypt/ on the EC2 host.
      # Mount it read-only into the container so nginx can serve HTTPS.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    # Pull pre-built image from ECR — built and pushed by GitHub Actions CI.
    image: ${ECR_REGISTRY}/jobtracker-backend:latest
    # No ports exposed to host — backend is only reachable from nginx via Docker's internal network.
    # Docker Compose gives each service a hostname matching its name, so nginx reaches it as "backend".
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080  # Kestrel listens on HTTP only — Nginx handles SSL
      # Secrets injected at deploy time via .env or EC2 environment — never hardcoded here.
      # __ = nested config separator in ASP.NET (e.g. ConnectionStrings__X → ConnectionStrings:X)
      - ConnectionStrings__JobTrackerContext=${DB_CONNECTION_STRING}
      - Jwt__Key=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Storage__S3BucketName=${S3_BUCKET_NAME}
      - Demo__ResetKey=${DEMO_RESET_KEY}
      - Email__FromAddress=${EMAIL_FROM_ADDRESS}
      - Resend__ApiKey=${RESEND_API_KEY}
      - AWS_REGION=ap-southeast-2  # AWS SDK reads this automatically for S3 + IAM
    restart: unless-stopped
