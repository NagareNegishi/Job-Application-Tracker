server {
    # - Beginner's guide: nginx.org/en/docs/beginners_guide.html
    # The config is structured as blocks: http {} → server {} → location {}.
    # We only needs the server block because nginx:alpine's default config already wraps it in http {}.
    listen 80;

    # Vite builds to dist/ — we copy that into this directory in the Dockerfile
    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ─────────────────────────────────────────────────────
    # "always" = include on error responses (4xx/5xx) too, not just 2xx.
    # WARNING: adding add_header inside any location {} block causes nginx to
    # drop ALL headers defined here for that location — keep everything at server level.

    # Forces browser to trust declared Content-Type, not sniff the bytes.
    # Stops a malicious .txt upload from being executed as JavaScript.
    add_header X-Content-Type-Options "nosniff" always;

    # Prevents this site from being embedded in an <iframe> on another domain (clickjacking).
    add_header X-Frame-Options "DENY" always;

    # Controls Referer header on outbound links: full URL same-origin, origin-only cross-origin.
    # Keeps internal paths (e.g. /jobs/42) off third-party server logs.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disables browser features this app doesn't use.
    # If JS is ever compromised, attacker can't silently access camera/mic/location.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # SPA routing: if the file doesn't exist on disk, serve index.html
    # and let React Router handle the URL in the browser
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api/* requests to the backend.
    # "backend" resolves via Docker's internal DNS — it's the service name in compose.prod.yml.
    # Never exposed to the internet; only reachable on the Docker network.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        # Pass real client info to the backend so logs and auth aren't all Docker gateway IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
