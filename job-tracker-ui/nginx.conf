# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
# All plain HTTP traffic is immediately redirected to HTTPS.
# 301 = permanent redirect — browsers and search engines remember this.
server {
    listen 80;
    server_name jobtracker.nagarenegishi.com;
    return 301 https://$host$request_uri;
}

# ── HTTPS server ──────────────────────────────────────────────────────────────
server {
    # - Beginner's guide: nginx.org/en/docs/beginners_guide.html
    # The config is structured as blocks: http {} → server {} → location {}.
    # We only needs the server block because nginx:alpine's default config already wraps it in http {}.
    listen 443 ssl;
    server_name jobtracker.nagarenegishi.com;

    # TLS certificate files written by Certbot on the EC2 host, mounted into
    # this container via compose.prod.yml. fullchain.pem = your cert + intermediate
    # CA cert bundled together. privkey.pem = your private key (never leaves the server).
    ssl_certificate     /etc/letsencrypt/live/jobtracker.nagarenegishi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobtracker.nagarenegishi.com/privkey.pem;

    # Vite builds to dist/ — we copy that into this directory in the Dockerfile
    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ─────────────────────────────────────────────────────
    # "always" = include on error responses (4xx/5xx) too, not just 2xx.
    # WARNING: adding add_header inside any location {} block causes nginx to
    # drop ALL headers defined here for that location — keep everything at server level.

    # Forces browser to trust declared Content-Type, not sniff the bytes.
    # Stops a malicious .txt upload from being executed as JavaScript.
    add_header X-Content-Type-Options "nosniff" always;

    # Prevents this site from being embedded in an <iframe> on another domain (clickjacking).
    add_header X-Frame-Options "DENY" always;

    # Controls Referer header on outbound links: full URL same-origin, origin-only cross-origin.
    # Keeps internal paths (e.g. /jobs/42) off third-party server logs.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disables browser features this app doesn't use.
    # If JS is ever compromised, attacker can't silently access camera/mic/location.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP — allowlist of where the browser may load each resource type from.
    # Main XSS defense: even if an attacker injects <script src="evil.com">, browser refuses it.
    #
    # style-src 'unsafe-inline'  — Tailwind generates inline style attributes at runtime
    # img-src data:               — shadcn/ui embeds SVG icons as data: URIs
    # connect-src S3 domain       — fetch() follows the pre-signed URL redirect for doc downloads
    # frame-ancestors 'none'      — modern replacement for X-Frame-Options (both set for coverage)
    #
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://jobtracker-documents-572059939731-ap-southeast-2-an.s3.ap-southeast-2.amazonaws.com; font-src 'self'; object-src 'none'; frame-ancestors 'none'" always;

    # ── HSTS (HTTP Strict Transport Security) ────────────────────────────────
    # Tells the browser: always use HTTPS for this domain, even if the user types http://.
    # Closes the window for network interception (e.g. public Wi-Fi) on the very first visit.
    # Only set here in the 443 block — sending HSTS over HTTP is meaningless and ignored.
    # max-age=31536000 = 1 year. includeSubDomains covers any subdomains too.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # SPA routing: if the file doesn't exist on disk, serve index.html
    # and let React Router handle the URL in the browser
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api/* requests to the backend.
    # "backend" resolves via Docker's internal DNS — it's the service name in compose.prod.yml.
    # Never exposed to the internet; only reachable on the Docker network.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        # Pass real client info to the backend so logs and auth aren't all Docker gateway IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
