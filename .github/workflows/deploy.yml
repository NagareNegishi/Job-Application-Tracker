name: Deploy to Production

on:
  push:
    branches: [main]

# Shared env vars available to all jobs.
# Keeps image names consistent across build-push and deploy jobs.
env:
  AWS_REGION: ap-southeast-2
  BACKEND_IMAGE: ${{ secrets.ECR_REGISTRY }}/jobtracker-backend
  NGINX_IMAGE: ${{ secrets.ECR_REGISTRY }}/jobtracker-nginx

jobs:
  # Runs xUnit tests — build-push and deploy declare needs: test, so a failure here stops the pipeline
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        run: dotnet test --verbosity normal
