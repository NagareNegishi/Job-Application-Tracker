name: Reset Demo Data

on:
  schedule:
    # RDS shutdown at midnight, GitHub Actions could delay ~2 hr 
    # Runs ~9:30 PM Sydney time daily
    - cron: '30 9 * * *'
  workflow_dispatch:       # manual trigger from GitHub Actions UI

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Reset demo data
        run: |
          curl -X POST https://jobtracker.nagarenegishi.com/api/auth/demo/reset \
               -H "X-Reset-Key: ${{ secrets.DEMO_RESET_KEY }}" \
               --fail
      - name: Clean up unverified accounts
        run: |
          curl -X POST https://jobtracker.nagarenegishi.com/api/auth/cleanup-unverified \
               -H "X-Reset-Key: ${{ secrets.DEMO_RESET_KEY }}" \
               --fail
