services:
  db:
    image: postgres
    restart: always
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # POSTGRES_USER and POSTGRES_DB are optional, default to "postgres"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      # Refer where postgres mount the data volume:
      # https://hub.docker.com/_/postgres
      # ~17 versions: /var/lib/postgresql/data
      # 18+ versions: /var/lib/postgresql
      - job_tracker_postgres:/var/lib/postgresql

volumes:
  job_tracker_postgres: